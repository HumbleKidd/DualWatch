<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DualStream</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://w.soundcloud.com/player/api.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-2: #181c25;
    --line: #262b36;
    --text: #eef1f6;
    --muted: #8b93a7;
    --accent: #6ee7b7;
    --accent-2: #60a5fa;
    --warn: #fbbf24;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: "DM Sans", system-ui, sans-serif; }
  body { overflow: hidden; }

  .app {
    height: 100%;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #10131a, #0b0d12);
  }
  .logo {
    font-weight: 700; letter-spacing: -0.03em; font-size: 18px;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .logo span { color: var(--accent); }
  .search-wrap {
    flex: 1; display: flex; gap: 8px; max-width: 720px;
  }
  input, select, button {
    font-family: inherit; font-size: 14px; color: var(--text);
  }
  .search-wrap input {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 16px; outline: none;
  }
  .search-wrap input:focus { border-color: #3b4458; }
  .pill {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 0 12px; height: 40px;
  }
  .modes { display: flex; gap: 8px; margin-left: auto; }
  .mode-btn, .icon-btn {
    height: 40px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); padding: 0 14px; cursor: pointer;
    color: var(--muted);
  }
  .mode-btn.active { color: #04110b; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .icon-btn:hover, .mode-btn:hover { border-color: #3b4458; }

  .stage {
    position: sticky; top: 0; z-index: 20;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 12px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .pane-player {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    min-height: 220px;
    display: flex; flex-direction: column;
  }
  .pane-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .pane-head strong { color: var(--text); font-size: 13px; }
  .frame-wrap { position: relative; aspect-ratio: 16/9; background: #000; }
  .frame-wrap iframe, .frame-wrap .placeholder {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .placeholder {
    display: grid; place-items: center; color: var(--muted); font-size: 13px;
    background: radial-gradient(circle at 30% 20%, #1a2230, #0a0c10);
  }
  body.music .frame-wrap { aspect-ratio: auto; height: 92px; }
  body.music .frame-wrap iframe { height: 166px; top: -40px; }
  body.music .pane-player { min-height: 0; }
  .now {
    padding: 8px 12px 10px; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .now b { color: var(--text); font-weight: 600; }

  .rails {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    min-height: 0; padding: 0 16px 16px;
  }
  .rail {
    min-height: 0; overflow: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
  }
  .rail h3 {
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); padding: 4px 6px 10px;
  }
  .card {
    display: grid; grid-template-columns: 148px 1fr; gap: 10px;
    padding: 8px; border-radius: 12px; cursor: pointer;
  }
  .card:hover { background: var(--panel-2); }
  .thumb {
    width: 148px; height: 84px; border-radius: 10px; object-fit: cover; background: #222;
  }
  .meta { font-size: 13px; }
  .meta .title { font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
  .meta .sub { color: var(--muted); font-size: 12px; }

  .sc-bar {
    display: none; padding: 0 16px 10px;
  }
  body.music .sc-bar { display: block; }
  .sc-bar input {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px;
  }

  @media (max-width: 900px) {
    .stage, .rails { grid-template-columns: 1fr; }
    .app { overflow: auto; }
    body { overflow: auto; }
    .rails { height: auto; }
    .rail { max-height: 420px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">Dual<span>Stream</span></div>
      <div class="search-wrap">
        <input id="q" placeholder="Search YouTube…" />
        <select id="target" class="pill">
          <option value="left">Play on Left</option>
          <option value="right">Play on Right</option>
        </select>
        <button class="icon-btn" id="go">Search</button>
      </div>
      <div class="modes">
        <button class="mode-btn active" data-mode="video">Video</button>
        <button class="mode-btn" data-mode="music">Music</button>
      </div>
    </header>

    <div class="sc-bar">
      <input id="scUrl" placeholder="Optional: paste a SoundCloud track URL to load into the selected pane (music mode)" />
    </div>

    <section class="stage">
      <article class="pane-player" id="paneL">
        <div class="pane-head"><strong>Left</strong> <span id="srcL">YouTube</span></div>
        <div class="frame-wrap" id="wrapL">
          <div class="placeholder" id="phL">Search a video to start</div>
          <div id="ytL"></div>
          <iframe id="scL" hidden allow="autoplay"></iframe>
        </div>
        <div class="now" id="nowL">Nothing playing</div>
      </article>
      <article class="pane-player" id="paneR">
        <div class="pane-head"><strong>Right</strong> <span id="srcR">YouTube</span></div>
        <div class="frame-wrap" id="wrapR">
          <div class="placeholder" id="phR">Search a video to start</div>
          <div id="ytR"></div>
          <iframe id="scR" hidden allow="autoplay"></iframe>
        </div>
        <div class="now" id="nowR">Nothing playing</div>
      </article>
    </section>

    <section class="rails">
      <div class="rail" id="railL">
        <h3>Related · Left</h3>
        <div id="listL"></div>
      </div>
      <div class="rail" id="railR">
        <h3>Related · Right</h3>
        <div id="listR"></div>
      </div>
    </section>
  </div>

<script>
const INV = ["https://invidious.f5.si", "https://yt.chocolatemoo53.com", "https://invidious.nerdvpn.de"];
let inv = INV[0];
let mode = "video";
const players = { left: null, right: null };
const scWidgets = { left: null, right: null };

function $(id) { return document.getElementById(id); }

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    document.body.classList.toggle("music", mode === "music");
  };
});

$("go").onclick = search;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
$("scUrl").addEventListener("keydown", e => {
  if (e.key === "Enter" && $("scUrl").value.trim()) loadSoundCloud($("target").value, $("scUrl").value.trim());
});

async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  const side = $("target").value;
  const items = await ytSearch(q);
  renderList(side, items, `Results · ${q}`);
  if (items[0]) playYoutube(side, items[0]);
}

async function ytSearch(q) {
  for (const host of INV) {
    try {
      const res = await fetch(`${host}/api/v1/search?q=${encodeURIComponent(q)}&type=video`);
      if (!res.ok) continue;
      const data = await res.json();
      inv = host;
      return data.filter(x => x.type === "video" && x.videoId).slice(0, 24);
    } catch (e) {}
  }
  return [];
}

async function related(videoId) {
  try {
    const res = await fetch(`${inv}/api/v1/videos/${videoId}`);
    const data = await res.json();
    return (data.recommendedVideos || []).slice(0, 20);
  } catch {
    return [];
  }
}

function thumbOf(v) {
  const t = (v.videoThumbnails || []).find(x => x.quality === "medium") || (v.videoThumbnails || [])[0];
  return t ? t.url.replace(/^\/\//, "https://") : "";
}

function fmt(sec) {
  sec = Number(sec) || 0;
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function renderList(side, items, title) {
  const rail = side === "left" ? $("railL") : $("railR");
  const list = side === "left" ? $("listL") : $("listR");
  rail.querySelector("h3").textContent = title || (side === "left" ? "Related · Left" : "Related · Right");
  list.innerHTML = items.map(v => `
    <div class="card" data-id="${v.videoId}">
      <img class="thumb" src="${thumbOf(v)}" alt="" />
      <div class="meta">
        <div class="title">${escapeHtml(v.title || "")}</div>
        <div class="sub">${escapeHtml(v.author || "")} · ${fmt(v.lengthSeconds)}</div>
      </div>
    </div>
  `).join("");
  list.querySelectorAll(".card").forEach(card => {
    card.onclick = () => {
      const v = items.find(x => x.videoId === card.dataset.id);
      if (v) playYoutube(side, v);
    };
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function playYoutube(side, video) {
  hideSC(side);
  const wrapId = side === "left" ? "ytL" : "ytR";
  const ph = side === "left" ? $("phL") : $("phR");
  const now = side === "left" ? $("nowL") : $("nowR");
  const src = side === "left" ? $("srcL") : $("srcR");
  ph.hidden = true;
  src.textContent = "YouTube";
  now.innerHTML = `<b>${escapeHtml(video.title)}</b> · ${escapeHtml(video.author || "")}`;

  const vars = {
    autoplay: 1,
    rel: 0,
    modestbranding: 1,
    playsinline: 1
  };

  if (!players[side]) {
    players[side] = new YT.Player(wrapId, {
      height: "100%",
      width: "100%",
      videoId: video.videoId,
      playerVars: vars,
      events: {
        onReady: e => e.target.playVideo()
      }
    });
  } else {
    players[side].loadVideoById(video.videoId);
    players[side].playVideo();
  }

  related(video.videoId).then(items => {
    if (items.length) renderList(side, items, "Related");
  });
}

function hideYT(side) {
  const el = side === "left" ? $("ytL") : $("ytR");
  const iframe = el.querySelector("iframe");
  if (players[side]) {
    try { players[side].stopVideo(); } catch(e) {}
  }
}

function hideSC(side) {
  const iframe = side === "left" ? $("scL") : $("scR");
  iframe.hidden = true;
  iframe.removeAttribute("src");
}

function loadSoundCloud(side, url) {
  hideYT(side);
  const iframe = side === "left" ? $("scL") : $("scR");
  const ph = side === "left" ? $("phL") : $("phR");
  const now = side === "left" ? $("nowL") : $("nowR");
  const src = side === "left" ? $("srcL") : $("srcR");
  ph.hidden = true;
  src.textContent = "SoundCloud";
  now.innerHTML = `<b>SoundCloud</b> · ${escapeHtml(url)}`;
  const embed = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(url) +
    "&color=%236ee7b7&auto_play=true&hide_related=false&show_comments=false&show_user=true&show_reposts=false&visual=" + (mode === "video");
  iframe.hidden = false;
  iframe.src = embed;
}

window.onYouTubeIframeAPIReady = function () {};
</script>
</body>
</html>
