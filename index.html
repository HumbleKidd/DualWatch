<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse - API-Free YouTube Experience</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8faff 0%, #edf2fc 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 1);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #ec4899;
            --shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.15);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 28px;
        }

        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }

        /* Header Navigation */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            font-size: 28px;
            -webkit-text-fill-color: var(--primary);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 50px;
            padding: 8px 20px;
            width: 400px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .search-bar:focus-within {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 15px;
            color: var(--text-main);
            margin-left: 10px;
        }

        /* Main Content View */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-meta {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .video-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
        }

        .video-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 16px;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .channel-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }

        .channel-details h4 {
            font-size: 16px;
            font-weight: 600;
        }

        .channel-details span {
            font-size: 13px;
            color: var(--text-muted);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: #f1f5f9;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        /* Sidebar Queue */
        .sidebar {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .playlist-card {
            display: flex;
            gap: 12px;
            padding: 10px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid transparent;
        }

        .playlist-card:hover {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.1);
            transform: translateX(4px);
        }

        .playlist-card.active {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .thumbnail-box {
            width: 110px;
            height: 65px;
            border-radius: 10px;
            background: #000;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .playlist-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .playlist-info h5 {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .playlist-info span {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header Section -->
        <header>
            <div class="logo">
                <i class="fa-solid fa-play-circle"></i>
                StreamPulse
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" id="customInputUrl" placeholder="Paste YouTube Video ID or select from queue..." />
            </div>
            <div class="user-profile">
                <div class="channel-avatar" style="width: 38px; height: 38px; font-size: 14px;">SP</div>
            </div>
        </header>

        <!-- Main Video Screen -->
        <div class="main-content">
            <div class="player-wrapper">
                <iframe id="mainPlayer" src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=1&enablejsapi=1" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="video-meta">
                <div class="video-title" id="videoTitleDisplay">Lofi Hip Hop Radio - Beats to Relax/Study to</div>
                <div class="video-actions">
                    <div class="channel-info">
                        <div class="channel-avatar">L</div>
                        <div class="channel-details">
                            <h4 id="channelNameDisplay">Lofi Records</h4>
                            <span>12.5M subscribers</span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" id="likeBtn"><i class="fa-solid fa-heart"></i> <span id="likeCount">142K</span></button>
                        <button class="btn"><i class="fa-solid fa-share"></i> Share</button>
                        <button class="btn"><i class="fa-solid fa-bookmark"></i> Save</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar Playlist Queue -->
        <div class="sidebar">
            <h3><span>Up Next Queue</span> <i class="fa-solid fa-list-ul" style="color: var(--primary);"></i></h3>
            <div class="playlist-items" id="playlistContainer">
                <!-- Dynamically filled items -->
            </div>
        </div>
    </div>

    <script>
        // Curated video list using standard IDs (No API key needed!)
        const videoList = [
            {
                id: "jfKfPfyJRdk",
                title: "Lofi Hip Hop Radio - Beats to Relax/Study to",
                channel: "Lofi Records",
                thumb: "https://img.youtube.com/vi/jfKfPfyJRdk/hqdefault.jpg"
            },
            {
                id: "5qap5aO4i9A",
                title: "Lofi Hip Hop Radio - Live Coding & Chill",
                channel: "ChilledCow Archives",
                thumb: "https://img.youtube.com/vi/5qap5aO4i9A/hqdefault.jpg"
            },
            {
                id: "7NOS824UvXE",
                title: "Synthwave Radio - Chill synth / retro beats",
                channel: "Lofi Girl Synthwave",
                thumb: "https://img.youtube.com/vi/7NOS824UvXE/hqdefault.jpg"
            },
            {
                id: "DWcJFNfaw9c",
                title: "Coffee Shop Radio - Ambient Background Music",
                channel: "Cafe Music BGM",
                thumb: "https://img.youtube.com/vi/DWcJFNfaw9c/hqdefault.jpg"
            }
        ];

        const mainPlayer = document.getElementById('mainPlayer');
        const videoTitleDisplay = document.getElementById('videoTitleDisplay');
        const channelNameDisplay = document.getElementById('channelNameDisplay');
        const playlistContainer = document.getElementById('playlistContainer');
        const customInputUrl = document.getElementById('customInputUrl');
        const likeBtn = document.getElementById('likeBtn');
        const likeCount = document.getElementById('likeCount');

        let likes = 142000;
        let isLiked = false;

        // Render Playlist Queue
        function renderPlaylist(activeId = "jfKfPfyJRdk") {
            playlistContainer.innerHTML = '';
            videoList.forEach(video => {
                const card = document.createElement('div');
                card.className = `playlist-card ${video.id === activeId ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumbnail-box">
                        <img src="${video.thumb}" alt="thumbnail">
                    </div>
                    <div class="playlist-info">
                        <h5>${video.title}</h5>
                        <span>${video.channel}</span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    loadVideo(video.id, video.title, video.channel);
                    renderPlaylist(video.id);
                });
                playlistContainer.appendChild(card);
            });
        }

        function loadVideo(id, title, channel) {
            mainPlayer.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1`;
            videoTitleDisplay.textContent = title;
            channelNameDisplay.textContent = channel;
        }

        // Allow typing or pasting any custom YouTube video ID directly in search box
        customInputUrl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                let val = customInputUrl.value.trim();
                // Extract ID if full URL is pasted
                if (val.includes('watch?v=')) {
                    val = val.split('watch?v=')[1].split('&')[0];
                } else if (val.includes('youtu.be/')) {
                    val = val.split('youtu.be/')[1].split('?')[0];
                }
                if (val.length >= 10) {
                    loadVideo(val, "Custom Loaded Stream", "Direct URL Play");
                    renderPlaylist('');
                }
            }
        });

        // Like button interaction
        likeBtn.addEventListener('click', () => {
            if (!isLiked) {
                likes++;
                isLiked = true;
                likeBtn.style.color = 'var(--accent)';
            } else {
                likes--;
                isLiked = false;
                likeBtn.style.color = 'inherit';
            }
            likeCount.textContent = (likes / 1000).toFixed(1) + 'K';
        });

        // Initialize App
        renderPlaylist();
    </script>
</body>
</html>
